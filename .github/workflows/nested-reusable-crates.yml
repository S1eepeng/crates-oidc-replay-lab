name: nested reusable crates.io publisher

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish from the nested reusable workflow
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  nested-publish:
    name: job B / nested reusable publishes with its own OIDC token
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - name: Check out package source
        uses: actions/checkout@v6

      - name: Request GitHub OIDC JWT and exchange for crates.io token
        id: exchange
        shell: bash
        env:
          TOKEN_ENDPOINT: https://crates.io/api/v1/trusted_publishing/tokens
        run: |
          set -euo pipefail

          jwt="$(
            curl --silent --show-error --fail \
              --get \
              --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --data-urlencode 'audience=crates.io' \
              "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value'
          )"
          test -n "$jwt"
          echo "::add-mask::$jwt"

          JWT="$jwt" python3 - <<'PY'
          import base64, json, os
          jwt = os.environ["JWT"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          selected = {
              key: claims.get(key)
              for key in [
                  "aud", "repository", "repository_owner", "repository_owner_id",
                  "workflow_ref", "job_workflow_ref", "environment", "ref", "sha", "sub", "jti"
              ]
          }
          print("JOB_B_SELECTED_CLAIMS=" + json.dumps(selected, sort_keys=True, ensure_ascii=False))
          PY

          status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/crates-token-response.json" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --header 'Accept: application/json' \
              --header 'User-Agent: crates-workflowref-jobworkflowref-lab/1.0' \
              --data "$(jq -cn --arg jwt "$jwt" '{jwt: $jwt}')" \
              "$TOKEN_ENDPOINT"
          )"
          echo "JOB_B_EXCHANGE_HTTP_STATUS=$status"
          cat "$RUNNER_TEMP/crates-token-response.json" | jq '{has_token: (.token != null), token_prefix: (.token | if . then .[0:7] else null end)}'
          test "$status" = "200"

          token="$(jq -r '.token' "$RUNNER_TEMP/crates-token-response.json")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish with job B token
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.exchange.outputs.token }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          manifest = pathlib.Path("Cargo.toml")
          text = manifest.read_text(encoding="utf-8")
          text, count = re.subn(r'(?m)^version = "[^"]+"$', f'version = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit("failed to update Cargo.toml version")
          manifest.write_text(text, encoding="utf-8")
          PY
          cargo generate-lockfile
          cargo publish --locked --allow-dirty
          echo "JOB_B_PUBLISH_VERSION=$VERSION"
