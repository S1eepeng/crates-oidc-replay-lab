name: crates.io Trusted Publishing lab

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - name: Check out the crate source
        uses: actions/checkout@v6

      - name: Test the exact source to publish
        run: cargo test --locked

      - name: Obtain a temporary crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish the crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

